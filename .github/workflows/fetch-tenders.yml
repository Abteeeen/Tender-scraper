name: Tender fetch robot

# Runs every 15 minutes to (A) auto-download approved VendorPanel packs and
# (B) scrape QTenders. You can also trigger it by hand from the Actions tab.
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

# Avoid overlapping runs if one takes longer than 15 min.
concurrency:
  group: tender-fetch-robot
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm install

      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium

      - name: Run robot
        env:
          VENDORPANEL_USER: ${{ secrets.VENDORPANEL_USER }}
          VENDORPANEL_PASS: ${{ secrets.VENDORPANEL_PASS }}
          GOOGLE_SA_JSON: ${{ secrets.GOOGLE_SA_JSON }}
          SHEET_ID: ${{ secrets.SHEET_ID }}
          DRIVE_FOLDER_ID: ${{ secrets.DRIVE_FOLDER_ID }}
          N8N_WEBHOOK_URL: ${{ secrets.N8N_WEBHOOK_URL }}
        run: npm run fetch
